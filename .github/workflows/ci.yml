name: CI

on:
  push:
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Segredos no git: varre TODO o histórico, de todos os branches.
  segredos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="--all" --redact --no-banner

  # Num pull request vindo de um branch do próprio repositório, o push já
  # rodou tudo: não repete.
  testes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # versão do campo packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O que vai para produção não pode ter vulnerabilidade alta ou crítica.
      - name: pnpm audit (dependências de produção, bloqueia)
        run: pnpm audit --prod --audit-level high

      # Ferramentas de desenvolvimento: aparece no log, não bloqueia. O
      # Dependabot abre o PR quando existir correção.
      - name: pnpm audit (tudo, só informa)
        run: pnpm audit || true

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: EXIF (re-encode do avatar, em Deno)
        run: pnpm test:exif

      # Chaves VAPID só deste runner, geradas agora: a pública vai para o
      # .env.local e a privada para supabase/functions/.env, que a Edge
      # Function de notificação lê. Precisa vir antes do `supabase start`.
      - name: Chaves das notificações push (descartáveis)
        run: node scripts/gerar-vapid.mjs

      # Studio, logs e pooler não participam de nenhum teste.
      - name: Supabase local
        run: pnpm exec supabase start -x studio,logflare,vector,imgproxy,supavisor

      - name: Variáveis do app (.env.local a partir do supabase status)
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/status.env"
          valor() { grep -E "^$1=" "$RUNNER_TEMP/status.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          chave="$(valor PUBLISHABLE_KEY)"
          [ -n "$chave" ] || chave="$(valor ANON_KEY)"
          [ -n "$chave" ] || { echo "supabase status não devolveu a chave anon/publishable"; exit 1; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(valor API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$chave"
            echo "GIPHY_API_KEY="
          } >> .env.local   # acrescenta: a chave VAPID pública já está lá
          rm "$RUNNER_TEMP/status.env"

      # Só mexe no Kong se o gateway não estiver respondendo (rede com
      # "search domain"). No runner do GitHub normalmente não é necessário.
      - name: Gateway responde (corrige o DNS do Kong só se precisar)
        run: |
          . ./.env.local
          saude() { curl -fsS -m 5 -o /dev/null -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/health"; }
          for i in $(seq 1 15); do saude && exit 0; sleep 2; done
          echo "Gateway sem resposta: aplicando scripts/corrigir-dns-kong.sh"
          bash scripts/corrigir-dns-kong.sh
          for i in $(seq 1 15); do saude && exit 0; sleep 2; done
          echo "O gateway continua sem responder."; docker ps; exit 1

      - name: Banco (pgTAP)
        run: pnpm test:db

      - name: Verificação da chave anon (o mesmo script do pós-deploy)
        run: |
          . ./.env.local
          node scripts/verificar-deploy.mjs "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" --testar-hook

      - name: Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Ponta a ponta (Playwright)
        run: pnpm test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
