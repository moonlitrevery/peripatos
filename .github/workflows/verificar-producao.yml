name: Verificar produção

# Roda o script de verificação pós-deploy contra o Supabase de PRODUÇÃO, uma
# vez por dia. Só faz leituras, com a chave pública.
#
# Fica desligado até existirem as variáveis do repositório SUPABASE_URL e
# SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions →
# Variables). São valores públicos: variáveis, não segredos.
#
# Ver docs/deploy.md, passo 14.

on:
  schedule:
    - cron: "17 11 * * *" # 08:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    if: vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sem dependências: o script só usa o Node.
      - run: node scripts/verificar-deploy.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
